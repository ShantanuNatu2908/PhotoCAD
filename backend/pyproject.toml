[project]
name = "photocad"
version = "0.1.0"
description = "Multi-Axis Vision to Parametric B-Rep CAD Platform"
authors = [{ name = "PhotoCAD Developer" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "opencv-python-headless>=4.10.0.84",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "google-genai>=0.1.1",
    "aiofiles>=24.1.0",
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=1.0.0",
    "langsmith>=0.2.0",
    "modal>=0.64.0",
    "asyncpg>=0.32.0",
    "pgvector>=0.5.1",
    "pyjwt>=2.15.1",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-checkpoint-redis>=0.6.0",
    "redis>=8.2.0",
    "psycopg[binary]>=3.3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
# Project-owned ruleset: correctness/import hygiene without legacy stylistic churn.
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["B008"]  # FastAPI dependency injection uses Depends()/Body() in defaults.

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
